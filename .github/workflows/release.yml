# Publish version tags after testing their contents. Release notes come from the matching
# CHANGELOG section. To release, add a dated version section to CHANGELOG.md, then push its
# vX.Y.Z tag.
#
# What a release publishes, all built once from the tagged tree:
#   - the wheel and sdist, with a CycloneDX SBOM and SHA-256 checksums, on the GitHub release;
#   - a build provenance attestation for each package (`gh attestation verify`);
#   - the Action image on ghcr.io, with its own provenance attestation and SBOM;
#   - the packages on PyPI, only when the repository variable PUBLISH_TO_PYPI is "true" and
#     the PyPI project trusts this workflow (trusted publishing, no stored token).
# Finally the moving major tag (v1) is updated so Action users receive the release.

name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish or republish, e.g. v1.0.0"
        required: true

permissions:
  contents: read # check out the tagged tree

# Releases run one at a time and are never cancelled halfway through publishing.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # Read from the environment in shell steps rather than interpolated into them, so the
  # dispatch input can never become shell syntax.
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # Test the tagged tree rather than relying on an earlier main-branch run.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      # No dependency cache in a release: a cache written by a less trusted run could
      # otherwise reach the published artifacts.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - run: pip install -e ".[dev]"
      - run: ruff check src tests benchmarks
      - run: ruff format --check src tests benchmarks
      - run: mypy
      - run: pytest -q

      # Verify the Docker image used by the published Action.
      - name: Build the action image
        run: docker build -t "tf-predeploy-firewall:${GITHUB_SHA}" .

      # Verify that the installed scanner can load its embedded schema packs.
      - name: Smoke-test the built image
        run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke && git init -q .
          cat > main.tf <<'EOF'
          resource "aws_instance" "app" {
            ami           = "ami-0abcdef1234567890"
            instance_type = "m5.large"
            hibernation   = true
            launch_template { id = "lt-0123456789" }
            totally_made_up_argument = "hallucinated"
          }
          EOF
          git add -A && git -c user.email=ci@example.com -c user.name=CI commit -qm smoke
          docker run --rm -v /tmp/smoke:/repo -w /repo \
            "tf-predeploy-firewall:${GITHUB_SHA}" \
            --repo-dir /repo --full-repo-scan --post-comment=false \
            --config /dev/null > /tmp/out.txt 2>/tmp/err.txt || true
          cat /tmp/err.txt /tmp/out.txt

          # Known valid arguments must not be reported as unknown.
          for arg in hibernation launch_template; do
            if grep -q "\"$arg\"" /tmp/out.txt; then
              echo "REGRESSION: '$arg' is valid but was reported"; exit 1
            fi
          done
          # An invented argument must still be detected.
          grep -q "totally_made_up_argument" /tmp/out.txt \
            || { echo "REGRESSION: unknown argument was not detected"; exit 1; }
          echo "smoke test passed"

  # Build the packages once. Everything after this job publishes these exact files.
  package:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # The pinned, hash-checked backend, rather than whatever an isolated build would fetch.
      - name: Build the distributions
        run: |
          pip install --require-hashes -r requirements/build.txt
          python -m build --no-isolation --outdir dist .

      # Building a wheel does not prove it contains schema data; inspect packaged resources
      # explicitly.
      - name: The wheel carries its rule packs
        run: |
          python -m zipfile -l dist/*.whl > /tmp/contents.txt
          for f in pack_aws_base.json.gz pack_azurerm_base.json.gz default.yml; do
            grep -q "$f" /tmp/contents.txt || { echo "$f missing from wheel"; exit 1; }
          done
          echo "packs and configuration present"

      # Install the built wheel into a fresh environment to test what users receive.
      - name: The wheel installs and runs
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --quiet dist/*.whl
          /tmp/fresh/bin/tf-predeploy-firewall --version

      # The SBOM lists what that installation resolved to: the package and its dependencies.
      - name: Write the SBOM and checksums
        run: |
          python -m venv /tmp/sbom
          /tmp/sbom/bin/pip install --quiet cyclonedx-bom==7.5.0
          mkdir -p release-assets
          /tmp/sbom/bin/cyclonedx-py environment /tmp/fresh/bin/python \
            --of JSON -o "release-assets/tf-predeploy-firewall-${RELEASE_TAG}.cdx.json"
          (cd dist && sha256sum ./*) > release-assets/checksums.txt
          cat release-assets/checksums.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error

  release:
    needs: [verify, package]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the release and move the major tag
      id-token: write # sign the provenance attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: release-assets/

      # Signed statements, recorded in the public transparency log, that these exact files were
      # built by this workflow from this commit.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      # Extract this release's notes from its versioned changelog section.
      - name: Extract release notes
        run: |
          awk -v tag="$RELEASE_TAG" '
            $0 ~ "^## \\[" tag "\\]" { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "No CHANGELOG section for $RELEASE_TAG" >&2
            exit 1
          fi
          cat /tmp/notes.md

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes-file /tmp/notes.md \
            --verify-tag dist/* release-assets/* 2>/dev/null \
          || { gh release edit "$RELEASE_TAG" \
                 --title "$RELEASE_TAG" \
                 --notes-file /tmp/notes.md; \
               gh release upload "$RELEASE_TAG" dist/* release-assets/* --clobber; }

      # Move the major tag through the API, so no credential is ever written to the checkout.
      - name: Move the major alias tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          major="${RELEASE_TAG%%.*}"
          commit=$(git rev-parse "${RELEASE_TAG}^{commit}")
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${major}" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${major}" \
              -f sha="$commit" -F force=true
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${major}" -f sha="$commit"
          fi
          echo "${major} now points to ${RELEASE_TAG} (${commit})"

  # The Action image, prebuilt. action.yml still builds from the Dockerfile; switching it to
  # this image needs the package to be public first (see docs/usage.md, "Verify a release").
  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # check out the tagged tree
      packages: write # push the image to ghcr.io
      id-token: write # sign the provenance attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push the image
        id: push
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx build . --push \
            --provenance=mode=max --sbom=true \
            --tag "${image}:${RELEASE_TAG}" \
            --tag "${image}:${RELEASE_TAG%%.*}" \
            --metadata-file /tmp/metadata.json
          digest=$(python3 -c 'import json; print(json.load(open("/tmp/metadata.json"))["containerimage.digest"])')
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # Off until the PyPI project exists and trusts this workflow: set the repository variable
  # PUBLISH_TO_PYPI to "true" once it does. Trusted publishing exchanges this job's OIDC token
  # for a short-lived upload token; no PyPI secret is stored anywhere.
  pypi:
    needs: release
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pypi
    permissions:
      id-token: write # exchanged for a short-lived PyPI upload token
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
