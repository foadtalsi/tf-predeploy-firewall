# Publish version tags after testing their contents. Release notes come from the matching
# CHANGELOG section; wheel and sdist assets are attached to GitHub, not PyPI. After publishing,
# update the moving major tag used by Actions. To release, add a dated version section to
# CHANGELOG.md, then push its vX.Y.Z tag.

name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish or republish, e.g. v1.0.0"
        required: true

jobs:
  # Test the tagged tree rather than relying on an earlier main-branch run.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy
      - run: pytest -q

      # Verify the Docker image used by the published Action.
      - name: Build the action image
        run: docker build -t tf-predeploy-firewall:${{ github.sha }} .

      # Verify that the installed scanner can load its embedded schema packs.
      - name: Smoke-test the built image
        run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke && git init -q .
          cat > main.tf <<'EOF'
          resource "aws_instance" "app" {
            ami           = "ami-0abcdef1234567890"
            instance_type = "m5.large"
            hibernation   = true
            launch_template { id = "lt-0123456789" }
            totally_made_up_argument = "hallucinated"
          }
          EOF
          git add -A && git -c user.email=ci@example.com -c user.name=CI commit -qm smoke
          docker run --rm -v /tmp/smoke:/repo -w /repo \
            tf-predeploy-firewall:${{ github.sha }} \
            --repo-dir /repo --full-repo-scan --post-comment=false \
            --config /dev/null > /tmp/out.txt 2>/tmp/err.txt || true
          cat /tmp/err.txt /tmp/out.txt

          # Known valid arguments must not be reported as unknown.
          for arg in hibernation launch_template; do
            if grep -q "\"$arg\"" /tmp/out.txt; then
              echo "REGRESSION: '$arg' is valid but was reported"; exit 1
            fi
          done
          # An invented argument must still be detected.
          grep -q "totally_made_up_argument" /tmp/out.txt \
            || { echo "REGRESSION: unknown argument was not detected"; exit 1; }
          echo "smoke test passed"

  # Validate the wheel used by Git installs and pre-commit environments.
  package:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install build
      - run: python -m build

      # Building a wheel does not prove it contains schema data; inspect packaged resources
      # explicitly.
      - name: The wheel carries its rule packs
        run: |
          python -m zipfile -l dist/*.whl > /tmp/contents.txt
          for f in pack_aws_base.json.gz pack_azurerm_base.json.gz default.yml; do
            grep -q "$f" /tmp/contents.txt || { echo "$f missing from wheel"; exit 1; }
          done
          echo "packs and configuration present"

      # Install the built wheel into a fresh environment to test what users receive.
      - name: The wheel installs and runs
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --quiet dist/*.whl
          /tmp/fresh/bin/tf-predeploy-firewall --version

  release:
    needs: [verify, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the version being released
        id: v
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "major=${TAG%%.*}" >> "$GITHUB_OUTPUT"

      # Extract this release's notes from its versioned changelog section.
      - name: Extract release notes
        run: |
          awk -v tag="${{ steps.v.outputs.tag }}" '
            $0 ~ "^## \\[" tag "\\]" { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "No CHANGELOG section for ${{ steps.v.outputs.tag }}" >&2
            exit 1
          fi
          cat /tmp/notes.md

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Attach wheel and sdist to the GitHub release. Users install from Git, these assets, or
      # pre-commit; there are no precompiled scanner binaries or PyPI uploads.
      - name: Build the distributions
        run: |
          pip install build
          python -m build
          (cd dist && sha256sum * > checksums.txt && cat checksums.txt)

      # Move the major tag so Action users receive this release.
      - name: Move the major alias tag
        run: |
          MAJOR="${{ steps.v.outputs.major }}"
          git tag -f "$MAJOR" "${{ steps.v.outputs.tag }}"
          git push -f origin "refs/tags/$MAJOR"
          echo "$MAJOR now points to ${{ steps.v.outputs.tag }}"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" \
            --title "${{ steps.v.outputs.tag }}" \
            --notes-file /tmp/notes.md \
            --verify-tag dist/* 2>/dev/null \
          || { gh release edit "${{ steps.v.outputs.tag }}" \
                 --title "${{ steps.v.outputs.tag }}" \
                 --notes-file /tmp/notes.md; \
               gh release upload "${{ steps.v.outputs.tag }}" dist/* --clobber; }
