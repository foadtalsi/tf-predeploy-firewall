name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default: no job here writes to the repository, its issues or its packages.
permissions:
  contents: read # check out the code

# A newer push to the same branch makes the running checks obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Test every supported Python version declared in package metadata.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      # Third-party actions are pinned to a full commit SHA, with the release it was taken
      # from in the comment; Dependabot proposes the updates (.github/dependabot.yml).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests benchmarks

      # Linting and formatting are separate checks.
      - name: Ruff format
        run: ruff format --check src tests benchmarks

      - name: Mypy
        run: mypy

      - name: Test
        run: pytest -q

  # Compare against the historical Go implementation. The binary is pinned below; no neighboring
  # Go source tree is required for the main parity cases.
  go-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.23"

      - name: Install
        run: pip install -e ".[dev]"

      # Build the Go revision used as the compatibility oracle. Match the Python package version
      # so SARIF comparisons do not fail on version metadata alone.
      - name: Build the Go scanner
        run: |
          version=$(python -c 'import importlib.metadata as m; print(m.version("tf-predeploy-firewall"))')
          go install -ldflags "-X main.version=$version" \
            github.com/foadtalsi/tf-predeploy-firewall/cmd/tf-predeploy-firewall@cf0bdd32d03866e3db023bd8223f848bfe89af8f
          echo "TFPDF_GO_BINARY=$(go env GOPATH)/bin/tf-predeploy-firewall" >> "$GITHUB_ENV"

      - name: Parity tests
        run: pytest -q tests/test_cli_parity.py

      # Fail if the oracle binary is missing. The optional old-checkout corpus test may still
      # skip.
      - name: Fail if the parity tests skipped
        run: |
          if pytest -q -rs tests/test_cli_parity.py 2>&1 | grep -q "TFPDF_GO_BINARY"; then
            echo "Parity tests skipped because the Go oracle was unavailable."
            exit 1
          fi

  # Test ForceNew extraction independently of provider-pack refresh jobs.
  forcenew-extractor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.23"
          # The extractor uses only the standard library and has no go.sum to cache.
          cache: false

      - name: Vet and test the extractor
        working-directory: tools/forcenew-extractor
        run: |
          gofmt -l . | tee /tmp/unformatted
          test ! -s /tmp/unformatted
          go vet ./...
          go test ./...

  # Known vulnerabilities in what the image ships, and security defects in the workflows
  # themselves: template injection, credentials left on disk, unpinned actions, excessive
  # permissions. Both tools are pinned like everything else.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install the audit tools
        run: pip install pip-audit==2.10.1 zizmor==1.30.1

      - name: Audit the image and build dependencies
        run: |
          pip-audit --require-hashes --disable-pip -r requirements/image.txt
          pip-audit --require-hashes --disable-pip -r requirements/build.txt

      - name: Audit the workflows
        run: zizmor --offline .github/workflows

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build -t "tf-predeploy-firewall:${GITHUB_SHA}" .

      # Verify the image starts, not just that it builds.
      - name: The image actually runs
        run: docker run --rm "tf-predeploy-firewall:${GITHUB_SHA}" --version
