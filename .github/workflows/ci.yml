name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Test every supported Python version declared in package metadata.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      # Linting and formatting are separate checks.
      - name: Ruff format
        run: ruff format --check src tests

      - name: Mypy
        run: mypy

      - name: Test
        run: pytest -q

  # Compare against the historical Go implementation. The binary is pinned below; no neighboring
  # Go source tree is required for the main parity cases.
  go-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install
        run: pip install -e ".[dev]"

      # Build the Go revision used as the compatibility oracle. Match the Python package version
      # so SARIF comparisons do not fail on version metadata alone.
      - name: Build the Go scanner
        run: |
          version=$(python -c 'import importlib.metadata as m; print(m.version("tf-predeploy-firewall"))')
          go install -ldflags "-X main.version=$version" \
            github.com/foadtalsi/tf-predeploy-firewall/cmd/tf-predeploy-firewall@cf0bdd32d03866e3db023bd8223f848bfe89af8f
          echo "TFPDF_GO_BINARY=$(go env GOPATH)/bin/tf-predeploy-firewall" >> "$GITHUB_ENV"

      - name: Parity tests
        run: pytest -q tests/test_cli_parity.py

      # Fail if the oracle binary is missing. The optional old-checkout corpus test may still
      # skip.
      - name: Fail if the parity tests skipped
        run: |
          if pytest -q -rs tests/test_cli_parity.py 2>&1 | grep -q "TFPDF_GO_BINARY"; then
            echo "Parity tests skipped because the Go oracle was unavailable."
            exit 1
          fi

  # Test ForceNew extraction independently of provider-pack refresh jobs.
  forcenew-extractor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          # The extractor uses only the standard library and has no go.sum to cache.
          cache: false

      - name: Vet and test the extractor
        working-directory: tools/forcenew-extractor
        run: |
          gofmt -l . | tee /tmp/unformatted
          test ! -s /tmp/unformatted
          go vet ./...
          go test ./...

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t tf-predeploy-firewall:${{ github.sha }} .

      # Verify the image starts, not just that it builds.
      - name: The image actually runs
        run: docker run --rm tf-predeploy-firewall:${{ github.sha }} --version
