# The built-in rule pack.
#
# This file is the scanner's detection content: what it looks for, how each
# finding is worded, and what it tells the reader afterwards. It is embedded
# into the binary, so a stock scanner needs nothing on disk — but it is data,
# not code, and editing it needs neither a Go toolchain nor a release.
#
# Two kinds of rule live here:
#
#   match:  — fully declarative. The engine walks resources and attributes
#             and applies the conditions. Everything about the rule, down to
#             the one-click fix, is in this file.
#
#   engine: — the traversal is compiled, because it is something a matcher
#             cannot express: a provider-schema lookup, a comparison against
#             the base revision, brace-matched scanning of raw source. The
#             rule still declares its identity, its parameters and its
#             documentation here.
#
# The vocabulary a rule may invoke (`confirm:`, `predicate:`, `fix.action:`)
# is fixed and provided by the binary. There is no expression language and
# no escape into code: this scanner runs inside other people's CI, and a
# rule format that can execute is a rule format that can be weaponised.

version: 1

# Defined once and referenced with YAML aliases below. Seven rules share the
# credential-name exclusion; seven copies of it would drift the first time
# one provider grew a new spelling.
anchors:
  credential_attr_names: &credential_attr_names '(?i)^(?:.*_)?(password|passwd|secret|secret_key|access_key|api_key|token|private_key|client_secret|auth_token|connection_string)$'
  placeholder_names: &placeholder_names '(?i)^(example|test|demo|foo|bar|my[-_]?bucket|my[-_]?app|sample|tmp|temp|placeholder)([-_].*)?$'

  # Where every value-shaped credential check looks, and what it ignores.
  # Held here rather than on the first rule that uses it so that merging it
  # in carries no stray pattern with it.
  credential_value_scope: &credential_value_scope
    scope: any_attribute
    literal: true
    # Below this there is not enough string to judge.
    min_length: 16
    # Names already reported by hardcoded_credential; without this exclusion
    # the same line would carry two findings.
    attr_name_not_matches: *credential_attr_names

rules:
  # ---------------------------------------------------------------------
  # tutorial_pattern — values that look copied rather than chosen
  # ---------------------------------------------------------------------

  # Matched by attribute NAME. Suffix-based rather than an exact list because
  # every provider grows its own vocabulary: azurerm alone has
  # administrator_login_password, admin_password and account_password, and a
  # per-provider list would always be one release behind. "key" is
  # deliberately not a bare suffix — public_key, partition_key and kms_key_id
  # are not secrets.
  - id: hardcoded_credential
    category: tutorial_pattern
    severity: critical
    match:
      scope: attribute
      literal: true
      attr_name_matches: *credential_attr_names
      # Bools and empties are never credentials.
      # manage_master_user_password = true is the opposite of a leak.
      value_not_one_of: ["", "true", "false"]
    message: '{attr_q} resolves to a hardcoded string literal{via}, not a secret reference — credentials must not be committed in plain text'
    suggestion: |-
      variable "{var}" {
        type      = string
        sensitive = true
      }

      # in {resource}:
      {attr} = var.{var}
    fix:
      action: replace_attr_line
      lines:
        - '{attr} = var.{var}'
      # Withheld when the literal was reached through a variable default or a
      # local. The line under the finding then already reads
      # `password = var.db_password` and is correct; swapping it for another
      # variable reference would fix nothing while looking like it had.
      skip_when_resolved: true
      note: |-
        This also needs the variable declared, and its value supplied outside the repository (TF_VAR_{var}, a tfvars file that isn't committed, or your secret manager):

        ```hcl
        variable "{var}" {
          type      = string
          sensitive = true
        }
        ```

        **The old value is still in this branch's git history — rotate it.**

  # Matched by VALUE, whatever the attribute is called — a key pasted into
  # user_data or a PEM block in an arbitrary field.
  #
  # One group, evaluated in order, first match wins per attribute: a JWT must
  # be reported as a JWT and not as "a high-entropy string", and the entropy
  # fallback at the end must not fire a second time on something already
  # named. Cheapest and most specific shapes come first.
  - id: credential_value_aws_access_key
    category: tutorial_pattern
    severity: critical
    group: credential_value
    label: AWS access key ID (AKIA…)
    match:
      <<: *credential_value_scope
      value_matches: 'AKIA[A-Z0-9]{16}'
    message: '{location}{attr_q} value matches pattern: {label}{via} — remove from source and use a secret reference'

  # 40 characters of base64. The character class alone matches any long run
  # of [a-z0-9/+], which an ordinary file path reaches easily — running this
  # scanner against its own repository reported a `local-exec` build command
  # as a leaked AWS key, at critical severity, on a 41-character path. That
  # is precisely the false positive that gets a scanner switched off.
  # Randomness is what separates the two, so the match is confirmed rather
  # than trusted.
  - id: credential_value_aws_secret_key
    category: tutorial_pattern
    severity: critical
    group: credential_value
    label: possible AWS secret key (40-char base64)
    match:
      <<: *credential_value_scope
      value_matches: '(?i)[a-z0-9/+]{40}'
      confirm: base64_secret
    message: '{location}{attr_q} value matches pattern: {label}{via} — remove from source and use a secret reference'

  - id: credential_value_pem
    category: tutorial_pattern
    severity: critical
    group: credential_value
    label: PEM private key
    match:
      <<: *credential_value_scope
      value_matches: '-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'
    message: '{location}{attr_q} value matches pattern: {label}{via} — remove from source and use a secret reference'

  - id: credential_value_jwt
    category: tutorial_pattern
    severity: critical
    group: credential_value
    label: JWT token
    match:
      <<: *credential_value_scope
      value_matches: '^ey[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
    message: '{location}{attr_q} value matches pattern: {label}{via} — remove from source and use a secret reference'

  - id: credential_value_github_token
    category: tutorial_pattern
    severity: critical
    group: credential_value
    label: GitHub personal access token
    match:
      <<: *credential_value_scope
      value_matches: '^(ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{82})$'
    message: '{location}{attr_q} value matches pattern: {label}{via} — remove from source and use a secret reference'

  # The label claims entropy, so the check measures it: hex tops out at 4
  # bits per character, and a repetitive run like forty a's is a valid hex
  # string with none of it.
  - id: credential_value_hex
    category: tutorial_pattern
    severity: critical
    group: credential_value
    label: high-entropy hex string (possible secret)
    match:
      <<: *credential_value_scope
      value_matches: '^[0-9a-f]{32,}$'
      confirm: hex_entropy
    message: '{location}{attr_q} value matches pattern: {label}{via} — remove from source and use a secret reference'

  # Last in the group: no known format matched, so randomness itself is the
  # only signal left. High rather than critical — this is a statistical
  # accusation, not a recognised credential shape.
  - id: credential_value_entropy
    category: tutorial_pattern
    severity: high
    group: credential_value
    match:
      <<: *credential_value_scope
      predicate: looks_like_secret
    message: '{location}{attr_q} value is a high-entropy string ({bits} bits/char over {length} chars){via} — this is the statistical signature of a machine-generated secret; if it is one, move it out of source and rotate it'

  # ---------------------------------------------------------------------

  - id: open_cidr
    category: tutorial_pattern
    severity: high
    match:
      scope: attribute
      literal: true
      attr_name_contains: cidr
      value_contains: 0.0.0.0/0
    message: '{attr_q} includes 0.0.0.0/0 (open to the entire internet) — common tutorial copy-paste, narrow this range'

  # ingress and egress only. A CIDR inside some other nested block is far
  # more likely to be a route table or a peering range than a firewall hole.
  - id: open_cidr_in_block
    category: tutorial_pattern
    severity: high
    match:
      scope: block_attribute
      block_types: [ingress, egress]
      literal: true
      attr_name_contains: cidr
      value_contains: 0.0.0.0/0
    message: '"{attr} (inside {block} block)" includes 0.0.0.0/0 (open to the entire internet) — common tutorial copy-paste, narrow this range'

  # ---------------------------------------------------------------------

  - id: placeholder_resource_name
    category: tutorial_pattern
    severity: low
    match:
      scope: resource_name
      name_matches: *placeholder_names
    message: 'resource local name {name_q} looks like a tutorial placeholder, not a deliberate identifier'

  - id: placeholder_attribute_value
    category: tutorial_pattern
    severity: low
    match:
      scope: attribute
      literal: true
      attr_names: [name, bucket, identifier, name_prefix, bucket_prefix]
      value_not_one_of: [""]
      value_matches: *placeholder_names
    message: '{attr} = {value_q} looks like a tutorial placeholder value'

  # ---------------------------------------------------------------------
  # Compiled traversals. Each needs something no matcher expresses.
  # ---------------------------------------------------------------------

  # Needs the provider's declared attribute surface, plus edit distance to
  # suggest what was meant. Severity is fixed; the message names the
  # near-miss it found.
  - id: unknown_attribute
    category: unknown_attribute
    severity: high
    engine: unknown_attribute

  # Needs the base revision to compare against: a ForceNew attribute is only
  # a finding when its value actually changed. Severity varies with how
  # destructive replacing that resource type would be.
  - id: force_new_change
    category: force_new_change
    severity: high
    engine: force_new_change

  # Needs the knowledge base's list of stateful types, and writes its fix by
  # editing HCL source in place.
  - id: missing_lifecycle
    category: missing_lifecycle
    severity: medium
    engine: missing_lifecycle

  # Needs brace-matched scanning of raw source: terraform { required_providers
  # {} } is not a resource block and never reaches the resource model.
  - id: unpinned_version
    category: unpinned_version
    severity: medium
    engine: unpinned_version

  # Needs per-type pricing and arithmetic against the base revision.
  - id: static_cost
    category: cost_impact
    severity: medium
    engine: static_cost
    params:
      # Overridden by --cost-threshold; zero disables the rule entirely.
      threshold_usd: "0"

  # ---------------------------------------------------------------------
  # Plan-based. These read terraform's own JSON plan rather than source, so
  # they have no line to anchor to and no source to match against.
  # ---------------------------------------------------------------------

  - id: confirmed_replace
    category: confirmed_replace
    severity: critical
    engine: confirmed_replace

  - id: unexpected_drift
    category: unexpected_drift
    severity: medium
    engine: unexpected_drift

  - id: large_blast_radius
    category: large_blast_radius
    severity: medium
    engine: large_blast_radius

  - id: plan_cost_impact
    category: cost_impact
    severity: medium
    engine: plan_cost_impact

# ---------------------------------------------------------------------
# Long-form documentation, one entry per category.
#
# This is what a reader meets on a GitHub code-scanning alert page, having
# not run the scan and having no context for the finding. docs/rules.md is
# generated from it, and every SARIF upload links there — so a category
# whose entry is missing becomes a dead link in someone else's security
# dashboard.
#
# Each entry answers the same four questions, and the fourth is not
# optional: a rule you cannot turn off is a rule that gets the whole tool
# turned off.
# ---------------------------------------------------------------------

docs:
  - category: unknown_attribute
    title: Unknown/hallucinated attribute
    full_description: An argument that the provider does not declare for this resource type. Terraform rejects it at plan time; the value of catching it here is that nobody waits for a plan to find out.
    markdown: |-
      ## What this means
  
      The argument isn't part of the resource type's schema in the provider version
      this scanner checked against. Terraform will reject it with
      `An argument named "…" is not expected here` — this finding is that
      error, delivered before CI spends a plan on it.
  
      ## Why it matters
  
      This is the most reliable signature of generated Terraform. A model asked for
      an argument that ought to exist will produce one that sounds exactly right,
      and it fails only once the plan runs — often after a reviewer has already
      approved the diff.
  
      ## How to fix it
  
      Open the linked provider documentation for the resource type and compare the
      argument list. Usually it is one of:
  
      - a near-miss on a real argument name,
      - an argument that belongs in a nested block rather than at the top level,
      - an argument removed in a provider major version.
  
      ## If you disagree
  
      The argument surface is generated from the provider's own schema, so a false
      positive here means the scanner's rule pack is older than your provider.
      Suppress a single line with `# tf-firewall-ignore: unknown_attribute`,
      or the whole category with `ignore_rules` in the config.
  - category: unpinned_version
    title: Unpinned module or provider version
    full_description: A module source or provider requirement with no version pin. The plan that was reviewed and the plan that runs later can differ with no commit in this repository to explain why.
    markdown: |-
      ## What this means
  
      A dependency floats instead of naming a version: a registry module with no
      `version`, a git source with no `?ref=`, or a `?ref=main`
      that points at a branch someone can push to. Or a provider in
      `required_providers` with no `version` constraint.
  
      ## Why it matters
  
      Two distinct problems, and the second is the serious one:
  
      **Reproducibility.** The plan a reviewer approved and the plan that runs an
      hour later can differ, because a third party published a release or moved a
      branch. Nothing in this repository records that, so when the apply goes
      wrong there is no commit to look at.
  
      **Supply chain.** Whoever can push to that branch decides what Terraform
      runs against your cloud account, with your credentials. A pinned tag can
      still be moved; a commit SHA cannot.
  
      This rule sits next to the AI-hallucination checks for a reason: generated
      Terraform almost never writes a version constraint. A model asked for "a VPC
      module" emits a source and moves on.
  
      ## How to fix it
  
      ```hcl
      module "vpc" {
        source  = "terraform-aws-modules/vpc/aws"
        version = "~> 5.0"                          # registry: add version
      }
  
      module "internal" {
        source = "git::https://github.com/org/mod.git?ref=v1.4.2"   # tag…
      }
  
      module "critical" {
        source = "git::https://github.com/org/mod.git?ref=9f8a1c2"  # …or a SHA
      }
  
      terraform {
        required_providers {
          aws = {
            source  = "hashicorp/aws"
            version = "~> 6.0"
          }
        }
      }
      ```
  
      A `.terraform.lock.hcl` committed alongside pins provider versions
      exactly, and is worth having regardless of the constraint above.
  
      ## If you disagree
  
      A local module (`./modules/vpc`) is versioned by this repository's
      own history and is never flagged. If you deliberately track a branch — an
      internal module you also own, released continuously — suppress with
      `# tf-firewall-ignore: unpinned_version`, or the category with
      `ignore_rules`.
  - category: tutorial_pattern
    title: Tutorial-copy pattern
    full_description: 'A value that looks copied from documentation rather than chosen: a credential written as a string literal, a CIDR open to the whole internet, or a placeholder name.'
    markdown: |-
      ## What this means
  
      The value matches a pattern that is normal in a tutorial and wrong in a real
      repository — a hardcoded credential, `0.0.0.0/0`, or a placeholder
      name like `example` or `test`.
  
      ## Why it matters
  
      A credential committed to a repository is disclosed to everyone with read
      access and stays in git history after it is removed. An ingress rule open to
      `0.0.0.0/0` is reachable from the entire internet, which is only ever
      deliberate for a small number of ports.
  
      ## How to fix it
  
      **Credentials:** move the value out of the repository — a variable supplied by
      your secret manager, or the provider's own managed-secret support (for RDS,
      `manage_master_user_password = true` removes the need for a password
      in configuration at all). **Then rotate the old value**: removing it from the
      file does not remove it from history.
  
      **Open CIDRs:** narrow to the ranges that actually need access. If a public
      listener is the intent, that is what a suppression comment is for.
  
      ## If you disagree
  
      Suppress one line with `# tf-firewall-ignore: tutorial_pattern`. A
      deliberately public load balancer is a legitimate reason; a credential is
      essentially never one.
  - category: force_new_change
    title: ForceNew change on stateful resource
    full_description: A changed argument that the provider marks ForceNew, meaning apply will destroy and recreate the resource rather than update it in place.
    markdown: |-
      ## What this means
  
      The provider marks this argument `ForceNew`: it cannot be changed on
      an existing resource. Applying this diff destroys the resource and creates a
      replacement.
  
      ## Why it matters
  
      On a stateful resource this is data loss and downtime, and it does not look
      like either in the diff — a one-line change to a name or an availability zone
      reads as trivial. This is the finding that most often catches something a
      human review missed.
  
      ## How to fix it
  
      Decide deliberately, then make the decision visible:
  
      - If replacement is intended, say so in the PR description, and check whether
        a snapshot or backup exists first.
      - If it is not, revert the argument and reach the goal another way — many
        resources have an in-place equivalent (renaming an RDS instance's
        `identifier` is in-place; changing its `availability_zone`
        is not).
      - Run `terraform plan` and read the `# forces replacement`
        annotations. Supplying the plan JSON to this action upgrades this heuristic
        finding into a confirmed one.
  
      ## If you disagree
  
      Nothing is wrong with a deliberate replacement — the finding exists so that it
      is deliberate. Suppress with `# tf-firewall-ignore: force_new_change`
      once you have decided.
  - category: missing_lifecycle
    title: Missing prevent_destroy
    full_description: A stateful resource with no lifecycle { prevent_destroy = true } guard, leaving it exposed to accidental deletion by an apply.
    markdown: |-
      ## What this means
  
      This resource type holds data that cannot be recreated from configuration —
      a database, a volume, a bucket — and carries no
      `lifecycle { prevent_destroy = true }` block.
  
      ## Why it matters
  
      `prevent_destroy` makes Terraform refuse to plan a destroy of the
      resource at all. Without it, the only thing standing between a mistaken
      `terraform destroy`, a removed block, or a ForceNew change and the
      loss of production data is somebody reading the plan output carefully.
  
      ## How to fix it
  
      ```hcl
      resource "aws_db_instance" "prod" {
        # …
  
        lifecycle {
          prevent_destroy = true
        }
      }
      ```
  
      This scanner posts that as an applicable suggestion on the PR where it can.
  
      Note that `prevent_destroy` blocks the plan rather than warning about
      it: intentionally destroying the resource later means removing the guard in
      its own commit, which is the point — it makes the deletion an explicit,
      reviewable act.
  
      ## If you disagree
  
      Ephemeral environments are the real exception. Scope the exemption to them
      with an `ignore_paths` entry rather than turning the rule off
      everywhere.
  - category: confirmed_replace
    title: Confirmed destroy/replace (from terraform plan)
    full_description: terraform plan confirms this apply destroys or replaces a stateful resource. Not a heuristic — Terraform's own diff says so.
    markdown: |-
      ## What this means
  
      This comes from the plan JSON you supplied, not from reading the `.tf`
      files: Terraform's own diff engine reports this resource as `delete`
      or `replace`.
  
      ## Why it matters
  
      There is no ambiguity left to argue about. If the resource holds data, this
      apply loses it.
  
      ## How to fix it
  
      Confirm a backup or snapshot exists, then decide whether the replacement is
      what you meant. If it isn't, `terraform plan` output names the
      attribute forcing it — the fix is to change that attribute back.
  
      A `lifecycle { prevent_destroy = true }` guard would have turned this
      into a plan-time refusal instead of an approved PR.
  
      ## If you disagree
  
      A deliberate replacement of a resource that holds nothing you need is
      legitimate. Suppress with `# tf-firewall-ignore: confirmed_replace`
      after checking, not before.
  - category: unexpected_drift
    title: Unexpected drift (from terraform plan)
    full_description: terraform plan changes a sensitive attribute that this PR's own .tf diff never touched — the change comes from somewhere else.
    markdown: |-
      ## What this means
  
      The plan modifies an attribute that nothing in this PR's Terraform diff
      touches. The change originates elsewhere: a module version bump, a provider
      upgrade, a variable's value, or infrastructure that was modified outside
      Terraform.
  
      ## Why it matters
  
      It is the change nobody is reviewing. The diff on screen doesn't contain it,
      so the reviewer's attention is on a different set of lines entirely.
  
      ## How to fix it
  
      Work out where it comes from before applying:
  
      - `terraform plan` shows the before and after values.
      - If the resource was changed by hand in the console, the plan is about to
        revert that change.
      - If a module or provider upgrade caused it, read that release's changelog.
  
      ## If you disagree
  
      Expected drift after a provider upgrade is common — suppress it for that PR
      with `# tf-firewall-ignore: unexpected_drift` rather than adding
      `unexpected_drift` to `ignore_rules` permanently, which
      turns off the only rule that watches changes nobody is reviewing.
  - category: large_blast_radius
    title: Large blast radius (from terraform plan)
    full_description: The plan destroys or replaces an unusually large number of resources at once.
    markdown: |-
      ## What this means
  
      The count of destroy and replace actions in this plan is above the configured
      threshold (`plan_blast_radius_threshold`, default 10).
  
      ## Why it matters
  
      Large replacements are usually a symptom rather than an intent — a renamed
      module, a changed `for_each` key, a moved resource — and they are
      exactly the plans people approve without reading to the end.
  
      ## How to fix it
  
      Check whether the resources are being **moved** rather than replaced. If they
      are, `moved` blocks (or `terraform state mv`) preserve them
      and reduce the plan to nothing. If the replacement is real, consider splitting
      the change into several applies.
  
      ## If you disagree
  
      Tearing down a whole environment is a legitimate large plan. Raise
      `plan_blast_radius_threshold` for a repo where that is routine.
  - category: cost_impact
    title: Estimated cost impact
    full_description: The change increases the estimated monthly bill by more than the configured threshold. Estimates are coarse and on-demand-only.
    markdown: |-
      ## What this means
  
      Summing the coarse per-type prices in the rule pack, this change raises the
      estimated monthly cost by more than `cost_impact_threshold_usd`.
  
      With a plan JSON supplied, the estimate reads Terraform's own diff (counts
      and for_each included). Without one, a static estimate reads the `.tf`
      source directly — new resources of priced types, and changes to the
      attribute that drives a type's price — with no multipliers, since inventing
      a fleet size would be worse than understating one. When a plan is supplied,
      only the plan-based estimate runs; the same PR is never billed twice by two
      estimators that could disagree.
  
      ## Why it matters
  
      Cost mistakes in Terraform are silent and recurring. A wrong instance size or
      a forgotten NAT gateway bills every hour until somebody reads an invoice, and
      the diff that introduced it looked like one word.
  
      ## How to fix it
  
      Check the resource types and sizes the finding names. The most common causes
      are an oversized instance class copied from an example, a NAT gateway where a
      gateway endpoint would do, and provisioned capacity left at a default.
  
      ## Accuracy
  
      These are **estimates**, deliberately coarse: on-demand list prices, no
      reserved instances, no savings plans, no data transfer, no per-request
      charges. Treat a finding as a prompt to look, not as a quote. Set
      `cost_impact_threshold_usd: 0` to switch the category off.
