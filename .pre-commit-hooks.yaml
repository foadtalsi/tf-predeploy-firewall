# Hook definition for https://pre-commit.com — lets any repo add this
# scanner to its pre-commit config with three lines:
#
#   repos:
#     - repo: https://github.com/foadtalsi/tf-predeploy-firewall
#       rev: v1.1.0
#       hooks:
#         - id: tf-predeploy-firewall
#
# pre-commit builds an isolated virtualenv from this repo's pyproject.toml
# (language: python), so there is nothing to install first and the hook pins to
# the rev above rather than to whatever happens to be on PATH. That was already
# true under language: golang; what changes is that the environment is a venv
# with PyYAML in it instead of a compiled binary, which means no Go toolchain is
# needed on a contributor's machine.
- id: tf-predeploy-firewall
  name: TF Pre-Deploy Firewall
  description: >
    Scans the staged Terraform changes for hardcoded credentials,
    hallucinated attributes, destroy+recreate traps and missing
    prevent_destroy guards — before they enter git history, while removing a
    secret is still an edit and not a rotation.
  entry: tf-predeploy-firewall --staged
  language: python
  # The scanner reads the git index itself, so it needs no filename
  # arguments; the files filter just keeps the hook from running on commits
  # that touch no Terraform at all.
  #
  # .tfvars is spelled out rather than left to `\.tf`, which anchors at the
  # end and does not match it. A commit that only adds terraform.tfvars is
  # the single most valuable one for this hook to see — that file is where
  # values live, so it is where a secret lands.
  files: (\.tf|\.tfvars|\.tfvars\.json|terragrunt\.hcl)$
  pass_filenames: false
