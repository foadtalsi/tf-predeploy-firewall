  - {rule: confirmed_replace, target: aws_db_instance.resized}
  - {rule: confirmed_replace, target: aws_s3_bucket.new}
  - {rule: confirmed_replace, target: aws_kms_key.data}
  - {rule: confirmed_replace, target: data.aws_db_instance.lookup}
