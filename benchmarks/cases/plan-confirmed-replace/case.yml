  - {rule: confirmed_replace, target: aws_s3_bucket.backups}
  - {rule: confirmed_replace, target: aws_instance.web}
  - {rule: confirmed_replace, target: aws_dynamodb_table.sessions}
  - {rule: confirmed_replace, target: module.data.aws_rds_cluster.this}
must_not_report:
