description: Encryption at rest and in transit switched off, weak TLS floors, and safe look-alikes.
expect:
  - {rule: encryption_at_rest_disabled, target: aws_db_instance.unencrypted}
  - {rule: encryption_at_rest_disabled, target: aws_rds_cluster.unencrypted}
  - {rule: encryption_at_rest_disabled, target: aws_ebs_volume.unencrypted}
  - {rule: encryption_at_rest_disabled, target: aws_elasticache_replication_group.unencrypted_at_rest}
  - {rule: encryption_at_rest_disabled, target: aws_instance.unencrypted_root}
  - {rule: encryption_in_transit_disabled, target: aws_elasticache_replication_group.plaintext}
  - {rule: encryption_in_transit_disabled, target: aws_elasticache_replication_group.plaintext_sessions}
  - {rule: encryption_in_transit_disabled, target: azurerm_storage_account.plaintext}
  - {rule: encryption_in_transit_disabled, target: azurerm_linux_web_app.plaintext}
  - {rule: encryption_in_transit_disabled, target: azurerm_windows_web_app.plaintext}
  - {rule: weak_tls_policy, target: aws_lb_listener.tls_1_0_policy}
  - {rule: weak_tls_policy, target: aws_lb_listener.classic_default_policy}
  - {rule: weak_tls_policy, target: aws_lb_listener.tls13_with_tls10_floor}
  - {rule: weak_tls_policy, target: aws_api_gateway_domain_name.tls_1_0}
  - {rule: weak_tls_policy, target: azurerm_storage_account.tls_1_0}
  - {rule: weak_tls_policy, target: azurerm_mssql_server.tls_1_1}
must_not_report:
  - {rule: encryption_at_rest_disabled, target: aws_db_instance.encrypted}
  - {rule: encryption_at_rest_disabled, target: aws_ebs_volume.from_default}
  - {rule: encryption_at_rest_disabled, target: aws_efs_file_system.encrypted}
  - {rule: encryption_at_rest_disabled, target: azurerm_storage_account.single_encryption}
  - {rule: encryption_in_transit_disabled, target: aws_elasticache_replication_group.tls}
  - {rule: encryption_in_transit_disabled, target: azurerm_storage_account.https_only}
  - {rule: encryption_in_transit_disabled, target: azurerm_linux_web_app.https_only}
  - {rule: weak_tls_policy, target: aws_lb_listener.tls_1_2_policy}
  - {rule: weak_tls_policy, target: aws_lb_listener.tls13_policy}
  - {rule: weak_tls_policy, target: aws_api_gateway_domain_name.tls_1_2}
  - {rule: weak_tls_policy, target: azurerm_storage_account.tls_1_2}
